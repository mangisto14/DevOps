version: '3.8'

services:
  # Weather Backend Service
  backend:
    build:
      context: ./weather-backend
      dockerfile: Dockerfile
    container_name: weather-backend
    ports:
      - "5001:5000"
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-your_api_key_here}
      - FLASK_ENV=development
    networks:
      - weather-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./weather-backend:/app

  # Weather Frontend Service
  frontend:
    build:
      context: ./weather-frontend
      dockerfile: Dockerfile
    container_name: weather-frontend
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:5000
      - FLASK_ENV=development
    networks:
      - weather-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./weather-frontend:/app

networks:
  weather-network:
    driver: bridge

volumes: {}
