name: WeatherApp CI/CD

on:
  push:
    paths:
      - 'Projects/WeatherApp/**'
      - '.github/workflows/weatherapp-ci-cd.yml'
  pull_request:
    paths:
      - 'Projects/WeatherApp/**'
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/WeatherApp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: pip install -r weather-backend/requirements.txt

      - name: Install frontend dependencies
        run: pip install -r weather-frontend/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run test suite
        run: pytest -v

  deploy-backend:
    name: Deploy Backend to Railway
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend service
        working-directory: Projects/WeatherApp/weather-backend
        run: railway up --service weather-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Railway
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy frontend service
        working-directory: Projects/WeatherApp/weather-frontend
        run: railway up --service weather-frontend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
